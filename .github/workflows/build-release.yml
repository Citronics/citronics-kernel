name: build-release

# Build and publish the rc kernel debs automatically whenever the kernel
# fork's 6.18/rc branch moves (repository_dispatch sent by
# mlainez/linux-msm8x74's notify-kernel-build workflow), or on demand.
#
# Versioning: the workflow auto-tags the next ".N" suffix on the latest
# tag (v3.2-rc3 -> v3.2-rc3.1 -> v3.2-rc3.2 ...) so release.sh keeps its
# tag-driven contract and apt sees a monotonically increasing version.
# Human-cut tags (vX.Y, vX.Y-rcN) keep working exactly as before.
#
# After publishing, dispatches update-repo to Citronics/deb-packages
# (APT_DISPATCH_TOKEN secret), which refreshes the APT repository and in
# turn triggers the debos image rebuild. Skips gracefully if unset.

on:
  repository_dispatch:
    types: [kernel-rc-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu build-essential libdw-dev \
            libc6-dev-armhf-cross libc6-dev-arm64-cross \
            flex bison bc libssl-dev libelf-dev kmod cpio rsync \
            debhelper fakeroot dpkg-dev

      # Decide what this release would contain *before* creating a tag, so an
      # unchanged run costs neither a tag nor a build slot.
      - name: Plan release
        id: plan
        run: |
          LATEST=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1)
          # Human tags are vX.Y or vX.Y-rcN; anything longer carries an
          # auto ".N" build suffix that must be stripped to find the base.
          if echo "$LATEST" | grep -qE '^v[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            BASE="$LATEST"
          else
            BASE=$(echo "$LATEST" | sed -E 's/\.[0-9]+$//')
          fi
          N=$(git tag | grep -cE "^${BASE//./\\.}\.[0-9]+$" || true)
          NEXT="${BASE}.$((N + 1))"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next tag would be $NEXT (base $BASE)"

          # Same component rule release.sh applies, so detection sees exactly
          # the set that would be built.
          case "$BASE" in
            *-rc*) export ONLY_COMPONENT=rc ;;
            *)     export SKIP_COMPONENT=rc ;;
          esac

          ./changed-kernels.sh > /tmp/changed.tsv
          if [ -s /tmp/changed.tsv ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Will build:"; awk '{print "  " $2 " @ " substr($3,1,12)}' /tmp/changed.tsv
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed - no tag, no build, no release."
          fi

      - name: Tag this build
        if: steps.plan.outputs.any == 'true'
        run: |
          git config user.name  "Marc Lainez"
          git config user.email "marc.lainez@gmail.com"
          git tag "${{ steps.plan.outputs.tag }}"
          git push origin "${{ steps.plan.outputs.tag }}"
          echo "Tagged ${{ steps.plan.outputs.tag }}"

      - name: Build and release
        if: steps.plan.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          CHANGED_TSV: /tmp/changed.tsv
        run: ./release.sh

      # release.sh rewrites build-state.tsv only after the release succeeded.
      - name: Record what was built
        if: steps.plan.outputs.any == 'true'
        run: |
          git config user.name  "Marc Lainez"
          git config user.email "marc.lainez@gmail.com"
          if git diff --quiet -- build-state.tsv; then
            echo "build-state.tsv unchanged"
            exit 0
          fi
          git add build-state.tsv
          git commit -m "build-state: record ${{ steps.plan.outputs.tag }}"
          # The branch may have moved (another release, a config edit) while we
          # were building; rebase rather than clobber.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger APT repository update
        if: steps.plan.outputs.any == 'true'
        env:
          APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$APT_DISPATCH_TOKEN" ]; then
            echo "APT_DISPATCH_TOKEN not set — skipping APT update dispatch"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $APT_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Citronics/deb-packages/dispatches \
            -d '{"event_type":"update-repo"}'
          echo "Dispatched update-repo."
