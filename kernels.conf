# Kernel sources configuration
# Format: <phone> <name> <repo_url> <branch> <arch> <component> [meta]
# <name> must match a config file in configs/<name>.config
# <component>: main (release, what devices run), rc (release candidate) or
#              experimental - defaults to main if omitted. main kernels go to
#              the APT repository's main component; rc and experimental ones go
#              to its experimental component, which devices only use if they
#              opt in. rc kernels carry a "-rc" in their kernel release
#              (6.12.117-citronics-lime-fp2-rc), so they never share a package
#              name with the release kernel of the same version.
# [meta]: this kernel provides linux-image-citronics-lime-<phone>, the meta-package
#         the Lime images depend on (one per phone): its releases upgrade devices.
#         Only a main kernel may carry it.
# mlainez/linux-msm8x74 branch scheme (see its AGENTS.md):
#   <kver>/topic/* -> <kver>/staging -> <kver>/rc -> <kver>/release
#
# Every build rebuilds whichever kernels moved (changed-kernels.sh), whatever
# their component.
#
# FP2: 6.12 is the production series: its display works (drm/msm still has the
# vram carveout there), and as of 2026-08-05 its DVFS and thermal throttling are
# validated on the carrier rig - 6 h 45 min of alternating four-core load and
# idle, 267k frequency transitions, 86,931 gang-rail voltage writes with zero
# handshake timeouts. 6.12/rc is the try-out channel; 6.12/release is
# fast-forwarded from it once a build has been validated on the device.
# 6.18 is LTS-tracking work, rc only. The FP2 uses no other kernel series.
fp2  msm8x74-6.12     https://github.com/mlainez/linux-msm8x74   6.12/release         arm    main   meta
fp2  msm8x74-6.12-rc  https://github.com/mlainez/linux-msm8x74   6.12/rc              arm    rc
fp2  msm8x74-6.18-rc  https://github.com/mlainez/linux-msm8x74   6.18/rc              arm    rc
#
# FP3: its kernel pipeline is not set up yet. The 7.0.9 kernel in the APT
# repository was published by hand, so building it here would replace it on
# devices with an untested build. Uncomment once the FP3 is validated here.
#fp3 msm8953-7.0.y    https://github.com/msm8953-mainline/linux  v7.0.9-r0             arm64  main
#fp3 msm8953-staging  https://github.com/mlainez/linux-msm8953   staging               arm64  experimental
