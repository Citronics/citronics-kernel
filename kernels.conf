# Kernel sources configuration
# Format: <phone> <name> <repo_url> <branch> <arch> <component>
# <name> must match a config file in configs/<name>.config
# <component>: main (stable), experimental (mlainez forks) or rc (release candidates)
#              - defaults to main if omitted. rc kernels are skipped by normal releases
#              and built only for v<X>.<Y>-rc<N> tags, published as GitHub prereleases.
# mlainez/linux-msm8x74 branch scheme (see its AGENTS.md):
#   <kver>/topic/* -> <kver>/staging -> <kver>/rc -> <kver>/release
#
# FP2 scope, deliberately narrow: the vanilla 6.16 (upstream msm8974-mainline,
# none of our changes - the stable baseline the device is compared against) and
# our 6.18 rc. The 6.15 and 6.12 kernels are retired from the build: 6.15 is
# superseded by the 6.18 series and rebuilding them cost a full build slot per
# release for a result nobody installs. Re-enable by uncommenting if a 6.15
# regression ever needs bisecting.
fp2  msm8974-6.16.y   https://github.com/msm8974-mainline/linux  v6.16.12-msm8974     arm    main
#fp2 msm8974-6.12.y   https://github.com/msm8974-mainline/linux  qcom-msm8974-6.12.y  arm    experimental
#fp2 msm8x74-6.15.y   https://github.com/mlainez/linux-msm8x74   6.15/release         arm    experimental
#fp2 msm8x74-6.15-rc  https://github.com/mlainez/linux-msm8x74   6.15/rc              arm    rc
fp2  msm8x74-6.18-rc  https://github.com/mlainez/linux-msm8x74   6.18/rc              arm    rc
# 6.12 is the production series: its display works (drm/msm still has the vram
# carveout there), and as of 2026-08-05 its DVFS and thermal throttling are
# validated on the carrier rig - 6 h 45 min of alternating four-core load and
# idle, 267k frequency transitions, 86,931 gang-rail voltage writes with zero
# handshake timeouts.  Built as an rc so it publishes as a prerelease, like 6.18.
fp2  msm8x74-6.12-rc  https://github.com/mlainez/linux-msm8x74   6.12/rc              arm    rc
fp3  msm8953-7.0.y    https://github.com/msm8953-mainline/linux  v7.0.9-r0             arm64  main
fp3  msm8953-staging  https://github.com/mlainez/linux-msm8953   staging               arm64  experimental
